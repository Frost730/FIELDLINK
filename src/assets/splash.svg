<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="splashGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tacticalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="#090d16"/>

  <!-- Subtle Tactical Grid Overlay -->
  <g stroke="#141f38" stroke-width="1" stroke-opacity="0.5">
    <line x1="0" y1="480" x2="1080" y2="480"/>
    <line x1="0" y1="960" x2="1080" y2="960"/>
    <line x1="0" y1="1440" x2="1080" y2="1440"/>
    <line x1="270" y1="0" x2="270" y2="1920"/>
    <line x1="540" y1="0" x2="540" y2="1920"/>
    <line x1="810" y1="0" x2="810" y2="1920"/>
  </g>

  <!-- Central Glow -->
  <circle cx="540" cy="860" r="420" fill="url(#splashGlow)"/>

  <!-- Tactical Reticle -->
  <circle cx="540" cy="860" r="280" fill="none" stroke="#1e2c4d" stroke-width="2" stroke-dasharray="12 12"/>
  <circle cx="540" cy="860" r="200" fill="none" stroke="#1e2c4d" stroke-width="3"/>
  <circle cx="540" cy="860" r="120" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Crosshairs -->
  <line x1="540" y1="520" x2="540" y2="600" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="540" y1="1120" x2="540" y2="1200" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="860" x2="280" y2="860" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <line x1="800" y1="860" x2="880" y2="860" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Central Tactical Arrow -->
  <polygon points="540,730 630,970 540,920 450,970" fill="url(#tacticalGrad)"/>
  <circle cx="540" cy="860" r="12" fill="#ffffff"/>

  <!-- App Title -->
  <text x="540" y="1320" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="14">FIELDLINK</text>
  <text x="540" y="1370" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="20" font-weight="700" letter-spacing="8">OFFLINE TACTICAL MESH</text>
  <text x="540" y="1410" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="16" letter-spacing="4">SYSTEM PROTOCOL 1.0 • MIL-STD</text>
</svg>
